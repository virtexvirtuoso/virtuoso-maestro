version: "3.8"
services:
  maestro-be:
    build:
      dockerfile: backend.Dockerfile
      context: .
    ports:
      - 5050:5000
    environment:
      - CONFIG_FILE=maestro-prd.yaml
    depends_on:
      rethinkdb:
        condition: service_healthy
    entrypoint: bash
    command: ./wait-for-it.sh rethinkdb:28015 -- python3 main/rest_api.py
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/strategy/available"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
  maestro-bitmex:
    build:
      dockerfile: backend.Dockerfile
      context: .
    environment:
      - CONFIG_FILE=maestro-prd.yaml
    depends_on:
      rethinkdb:
        condition: service_healthy
    entrypoint: bash
    command: ./wait-for-it.sh rethinkdb:28015 -- python3 main/data_bitmex_download.py
  maestro-binance:
    build:
      dockerfile: backend.Dockerfile
      context: .
    environment:
      - CONFIG_FILE=maestro-prd.yaml
    depends_on:
      rethinkdb:
        condition: service_healthy
    entrypoint: bash
    command: ./wait-for-it.sh rethinkdb:28015 -- python3 main/data_binance_download.py
  maestro-fe:
    build:
      dockerfile: frontend.Dockerfile
      context: .
    ports:
      - 8080:5000
    depends_on:
      maestro-be:
        condition: service_healthy
    entrypoint: bash
    command: ./wait-for-it.sh maestro-be:5050 -- serve -s build
  rethinkdb:
    image: rethinkdb
    ports:
      - 8081:8080
      - 28015:28015
    volumes:
      - db-data:/data
    command: rethinkdb --bind all
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  questdb:
    image: questdb/questdb:latest
    ports:
      - 9010:9000   # Web console (mapped to 9010 to avoid conflicts)
      - 8812:8812   # PostgreSQL wire protocol
      - 9009:9009   # InfluxDB Line Protocol (ILP)
    volumes:
      - questdb-data:/var/lib/questdb
    environment:
      - QDB_PG_USER=admin
      - QDB_PG_PASSWORD=quest
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9000/exec?query=SELECT%201"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  db-data:
  questdb-data:
