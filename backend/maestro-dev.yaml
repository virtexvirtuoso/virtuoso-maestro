config:
  rethinkdb:
    host: 127.0.0.1
    port: 28015
    db: filos-dev
  datasource:
    bitmex:
      symbols:
        xbtusd:
          bin_size:
            - 1m
            - 5m
            - 1h
            - 1d
    binance:
      symbols:
        ethbtc:
          bin_size:
            - 1d
        ltcbtc:
          bin_size:
            - 1d
        zecbtc:
          bin_size:
            - 1d
        chzbtc:
          bin_size:
            - 1m
            - 5m
            - 1h
            - 1d
        iostbtc:
          bin_size:
            - 1d
  restapi:
    host: 127.0.0.1
    port: 5050
    debug: false
  optimization:
    output:
      results: optimization_results
      progress:  optimization_progress
    kind:
      walkforward:
        num_splits: 10
        mode: rolling  # rolling | expanding | adaptive
        volatility_window: 20  # For adaptive mode: days for rolling volatility
    parallel:
      enabled: true
      max_workers: null  # null = auto (cpu_count - 1)
    multi_objective:
      enabled: false  # Enable Pareto-based multi-objective selection
      method: pareto  # pareto | weighted | rank_average
      weights:  # Custom weights for metrics (default: balanced)
        sharpe_ratio: 0.30
        vwr: 0.25
        sortino_ratio: 0.20
        calmar_ratio: 0.15
        turnover_penalty: 0.10
    dataframe_cache:
      enabled: true  # Cache DataFrames in memory for walk-forward splits
